<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <title>レシピボックス2</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/recipes.css">
  <link rel="stylesheet" href="css/plan.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/fridge.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/sharing.css">
</head>
<body>
  <!-- 起動画面(先頭に置いて、描画の前に出す・出さないを決める) -->
  <div class="intro" id="intro" role="button" tabindex="0" aria-label="タップしてレシピボックスをはじめる" hidden>
    <img class="intro-mark" src="icons/icon.svg" width="96" height="96" alt="">
    <h1 class="intro-title">レシピボックス</h1>
    <p class="intro-copy">お気に入りの味を、ひとつの場所に。</p>
    <p class="intro-hint">タップしてはじめる</p>
  </div>
  <script>
    // 起動したときだけ出す(同じ起動中の再読み込みや、共有メニューから開いたときは出さない)
    try {
      if (!sessionStorage.getItem('rb2:intro') && !/share_/.test(location.search)) document.getElementById('intro').hidden = false;
    } catch (e) { /* 保存できない環境では出さない */ }
  </script>

  <!-- 上部バー:左にボックス名 ▾(共有の切り替え)、右に ≡(設定)。アプリ名は出さない -->
  <header id="topbar">
    <div class="topbar-inner">
      <button class="box-btn" id="boxBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="ボックスを切り替える">
        <span class="box-name" id="boxName">マイボックス</span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="sync-badge" id="syncBadge" data-state="local"></span>
      </button>
    </div>
  </header>

  <main>
    <!-- レシピ(ホーム):今日の献立 → 検索 → 絞り込み → カード。recipes.js / today.js が描く -->
    <section class="view" id="view-recipes"><div id="today"></div></section>
    <!-- 献立:plan.js が描く -->
    <section class="view" id="view-plan" hidden></section>
    <!-- 買い物:shop.js が描く -->
    <section class="view" id="view-shop" hidden></section>
  </main>

  <!-- 画面の切り替え(親指の届く下側) -->
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="画面の切り替え">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab" type="button" role="tab" data-tab="recipes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 016.5 3H18a1 1 0 011 1v15a1 1 0 01-1 1H6.5A1.5 1.5 0 015 18.5zM5 17.5A1.5 1.5 0 016.5 16H19M9 7.5h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>レシピ</span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>献立</span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="shop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.3l2-8H6.3M9 19.5a1 1 0 100 .01M17 19.5a1 1 0 100 .01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>買い物</span>
      <b class="badge" id="shopCount" hidden></b>
    </button>
  </nav>

  <!-- レシピを追加(右下・親指が届く位置)。アプリアイコンと同じ器のマーク。ブランド色を使う唯一のボタン -->
  <button class="fab" id="fab" type="button" aria-label="レシピを追加">
    <span class="fab-icon" aria-hidden="true">
      <svg class="bowl" viewBox="116 116 280 280" width="36" height="36">
        <path d="M146 246h220a110 110 0 0 1-220 0z" fill="currentColor"/>
        <rect x="200" y="366" width="112" height="18" rx="9" fill="currentColor"/>
      </svg>
      <svg class="steam" viewBox="116 116 280 280" width="36" height="36">
        <path d="M218 206c-16-20 16-34 0-58M294 206c-16-20 16-34 0-58" stroke="currentColor" stroke-width="18" fill="none" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="fab-plus" aria-hidden="true"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg></span>
  </button>

  <!-- ui.page / ui.sheet はここに作る -->
  <div id="overlays"></div>
  <!-- 動画の小窓(pip.js が中身を作る) -->
  <div id="pip" hidden></div>
  <!-- タイマー(timers.js が中身を作る) -->
  <div id="timers" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ゲート:Google ログイン / ログインせずに使う(app.js が開閉する) -->
  <div class="gate" id="gate" hidden>
    <section class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
      <img class="gate-mark" src="icons/icon.svg" alt="" width="72" height="72">
      <h2 id="gateTitle">レシピボックス2</h2>
      <p class="gate-lead">Google でログインすると、ほかの端末や<br>家族・友だちと同じレシピ帳が使えます。</p>
      <button class="btn primary wide" id="gateSignIn" type="button">Google でログイン</button>
      <p class="gate-error" id="gateError" hidden></p>
      <button class="link" id="gateLocal" type="button">ログインせずに使う(この端末だけに保存)</button>
    </section>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
